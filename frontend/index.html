<!DOCTYPE html>
<html lang="en">
  <head>
    
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Futismageritools</title>
  </head>

  <body>
    <h1>Futismanageri tools</h1>
    <div id="fixtures"></div>
    
    <label for="showFixtures"></label>
    <select name="fixtures" id="gameWeekSelecter" onchange="showSelectedFixtures()">
        <option value="kaikki">Kaikki</option>
        <option value="3">Seuraavat 3</option>
        <option value="5">Seuraavat 5</option>
        <option value="8">Seuraavat 8</option>
     </select> 

     <label for="sortFixtures"></label>
    <select name="sortFixtures" id="sortFixtures" onchange="showSortedFixtures()">
        <option value="default">Järjestä</option>
        <option value="easiest">helpoin</option>
        <option value="hardest">vaikein</option>
     </select> 


    <div id="ticker-container">
     
    <script src="../data/fixtures.js"></script>
    <script src="../data/teams.js"></script>
    <script src="app.js"></script>
  </body>
</html>
