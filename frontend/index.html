<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futismanageritools</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <h1>Otteluohjelmavertailu</h1>

    <div class="controls">
      <select name="fixtures" id="gameWeekSelecter" onchange="showSortedFixtures()">
        <option value="3">Seuraavat 3</option>
        <option value="5" selected>Seuraavat 5</option>
        <option value="8">Seuraavat 8</option>
      </select>

      <select name="sortFixtures" id="sortFixtures" onchange="showSortedFixtures()">
        <option value="easiest" selected>Helpoin</option>
        <option value="hardest">Vaikein</option>
        <option value="alphabetical">A–Ö</option>
      </select>
    </div>

    <div id="ticker-container"></div>

    <script src="/data/fixtures.js"></script>
    <script src="/data/teams.js"></script>
    <script src="app.js"></script>
  </body>
</html>
